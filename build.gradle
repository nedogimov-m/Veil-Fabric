plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = 'foundry.veil'
version = project.mod_version
base.archivesName = 'veil-fabric'

repositories {
    maven { url = uri('local-maven') }
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net' }
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'gg.moonflower'; includeGroup 'io.github.ocelot' } }
    maven { url = 'https://maven.ryanhcode.dev/releases'; content { includeGroup 'foundry.imguimc' } }
    maven { url = 'https://maven.caffeinemc.net/releases'; content { includeGroup 'net.caffeinemc' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

// Keep all upstream Fabric and shared implementation in the initial port.
// No compatibility layer or optional integration is omitted to obtain a green build.
sourceSets {
    main {
        java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'fabric/src/main/resources']
    }
    test {
        java.srcDirs = ['common/src/test/java']
        resources.srcDirs = ['common/src/test/resources']
    }
}

loom {
    accessWidenerPath = file('common/src/main/resources/veil.native.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    include(api("gg.moonflower:molang-compiler:${molang_compiler_version}"))
    include(api("io.github.ocelot:glsl-processor:${glsl_processor_version}"))
    implementation 'org.jetbrains:annotations:26.0.2'

    // Native optional APIs match the canonical source diagnostic. Older auxiliary
    // integration APIs below remain compile-only and are not runtime mods.
    // The production editor/profiler owns ImGui types at client startup. Bundle
    // the genuine client-only port with its declared binding/native jars.
    include(implementation('foundry.imguimc:imguimc-fabric-26.3:2.0.5-port.1+mc26.3'))
    compileOnly 'io.github.spair:imgui-java-binding:1.92.7.1'
    compileOnly("maven.modrinth:sodium:mc26.3-0.9.2-fabric") { transitive = false }
    compileOnly('maven.modrinth:iris:1.11.7+26.3-fabric') { transitive = false }
    compileOnly("maven.modrinth:replaymod:1.21-2.6.20") { transitive = false }
    compileOnly("maven.modrinth:flashback:0.32.0") { transitive = false }
    compileOnly("maven.modrinth:cameratweaks:1.7.0-1.21.1") { transitive = false }

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

def veilResourceVersion = project.version.toString()
processResources {
    inputs.property 'version', veilResourceVersion
    filesMatching('fabric.mod.json') { expand version: veilResourceVersion }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

test { useJUnitPlatform() }

jar {
    from('LICENSE') { rename { 'LICENSE_Veil' } }
    from('licenses') { into 'licenses' }
}
sourcesJar {
    from('LICENSE') { rename { 'LICENSE_Veil' } }
    from('licenses') { into 'licenses' }
}

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}
